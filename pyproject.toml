[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-url-shortener"
version = "0.1.0"
description = "Secure URL shortening API with governed, stateful agentic SDLC orchestration"
authors = [{name = "Ishee Gattani"}]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["url_shortener*", "orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
